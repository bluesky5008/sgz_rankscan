[project]
name = "rankscan"
version = "0.1.0"
description = "삼국지 전략판 공헌 랭킹 캡처·추출 도구"
requires-python = ">=3.12"
dependencies = [
    "pillow",
    "numpy",
    "opencv-python",
    "windows-capture",
    "winocr",
]

[project.scripts]
rankscan = "rankscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
